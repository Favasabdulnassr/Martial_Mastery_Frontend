name: Deploy Frontend to EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_TOKEN,REPO
          script: |
            # Check if the folder already exists
            if [ -d "martial_frontend" ]; then
              cd martial_frontend
              # Pull the latest code securely using GitHub's temporary action token
              git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git
              git pull origin main
            else
              # First time deployment: Clone the code securely
              git clone https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git martial_frontend
              cd martial_frontend
            fi
            
            # Write the .env file
            cat > .env <<EOF
            STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            EOF
            
            # Restart the frontend containers
            sudo docker compose down
            sudo docker compose up -d --build
